name: "CI Pipeline"

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ---------------------------------------------------------------------------
  # Step 1 (on PR): Validate PR Commits with Conventional Commits & Promotion
  # ---------------------------------------------------------------------------
  validate-commit:
    name: "1. Validate PR Commits"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate PR Commits (Conventional Commits)
        uses: ./actions/validate-commit
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          require-jira-id: "false"
          check-conventional-commit: "true"
          post-pr-comment: "true"

      - name: Validate Branch Promotion (Trunk-Based)
        uses: ./actions/validate-branch-promotion
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          strategy: "trunk-based"
          fail-on-violation: "true"
          post-comment: "true"

  # ---------------------------------------------------------------------------
  # Step 2 (on PR): Find Next Version via SemVer 2.0 & Conventional Commits
  # ---------------------------------------------------------------------------
  find-next-version:
    name: "2. Find Next SemVer"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-commit]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      has_bump: ${{ steps.semver.outputs.has_bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive Next SemVer Version
        id: semver
        uses: ./actions/derive-next-version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          default-version: "0.1.0"

      - name: Log Determined Version
        run: |
          echo "Next Version: ${{ steps.semver.outputs.version }}"
          echo "Bump Type:    ${{ steps.semver.outputs.bump_type }}"
          echo "Has Bump:     ${{ steps.semver.outputs.has_bump }}"

  # ---------------------------------------------------------------------------
  # Step 3: CI/CD Test & Bundle Suite (Starts after Next Version on PR, or on push)
  # ---------------------------------------------------------------------------
  test-validate-commit:
    name: "3. CI/CD - Test validate-commit"
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (github.event_name == 'push' || needs.find-next-version.result == 'success')
    needs: [find-next-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "actions/validate-commit/package-lock.json"

      - name: Install dependencies
        working-directory: actions/validate-commit
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: actions/validate-commit
        run: npm test

      - name: Build & Bundle
        working-directory: actions/validate-commit
        run: npm run bundle

      - name: Verify Bundle In Sync (No Drift)
        if: github.actor != 'dependabot[bot]'
        working-directory: actions/validate-commit
        run: |
          git diff --exit-code dist/ || (echo "Error: validate-commit dist/ is out of sync with src/. Run 'npm run bundle' locally and commit the changes." && exit 1)

      - name: Self-Test Default Regex Validation
        id: test-default
        uses: ./actions/validate-commit
        with:
          commit-message: "[PROJ-101] Updated configurations for production"
          require-jira-id: "true"
          jira-project-keys: "PROJ"

      - name: Verify Outputs
        run: |
          if [ "${{ steps.test-default.outputs.is-valid }}" != "true" ]; then
            echo "Expected is-valid to be true"
            exit 1
          fi
          if [ "${{ steps.test-default.outputs.jira-id }}" != "PROJ-101" ]; then
            echo "Expected jira-id to be PROJ-101"
            exit 1
          fi

  test-setup-branching-strategy:
    name: "3. CI/CD - Test setup-branching-strategy"
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (github.event_name == 'push' || needs.find-next-version.result == 'success')
    needs: [find-next-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "actions/setup-branching-strategy/package-lock.json"

      - name: Install dependencies
        working-directory: actions/setup-branching-strategy
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: actions/setup-branching-strategy
        run: npm test

      - name: Build & Bundle
        working-directory: actions/setup-branching-strategy
        run: npm run bundle

      - name: Verify Bundle In Sync (No Drift)
        if: github.actor != 'dependabot[bot]'
        working-directory: actions/setup-branching-strategy
        run: |
          git diff --exit-code dist/ || (echo "Error: setup-branching-strategy dist/ is out of sync with src/. Run 'npm run bundle' locally and commit the changes." && exit 1)

  test-prevent-committer-approval:
    name: "3. CI/CD - Test prevent-committer-approval"
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (github.event_name == 'push' || needs.find-next-version.result == 'success')
    needs: [find-next-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "actions/prevent-committer-approval/package-lock.json"

      - name: Install dependencies
        working-directory: actions/prevent-committer-approval
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: actions/prevent-committer-approval
        run: npm test

      - name: Build & Bundle
        working-directory: actions/prevent-committer-approval
        run: npm run bundle

      - name: Verify Bundle In Sync (No Drift)
        if: github.actor != 'dependabot[bot]'
        working-directory: actions/prevent-committer-approval
        run: |
          git diff --exit-code dist/ || (echo "Error: prevent-committer-approval dist/ is out of sync with src/. Run 'npm run bundle' locally and commit the changes." && exit 1)

  test-validate-branch-promotion:
    name: "3. CI/CD - Test validate-branch-promotion"
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (github.event_name == 'push' || needs.find-next-version.result == 'success')
    needs: [find-next-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "actions/validate-branch-promotion/package-lock.json"

      - name: Install dependencies
        working-directory: actions/validate-branch-promotion
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: actions/validate-branch-promotion
        run: npm test

      - name: Build & Bundle
        working-directory: actions/validate-branch-promotion
        run: npm run bundle

      - name: Verify Bundle In Sync (No Drift)
        if: github.actor != 'dependabot[bot]'
        working-directory: actions/validate-branch-promotion
        run: |
          git diff --exit-code dist/ || (echo "Error: validate-branch-promotion dist/ is out of sync with src/. Run 'npm run bundle' locally and commit the changes." && exit 1)

      - name: Self-Test Branch Promotion Validation
        id: test-promotion
        uses: ./actions/validate-branch-promotion
        with:
          strategy: "gitops"
          base-branch: "uat"
          head-branch: "dev"
          fail-on-violation: "true"

      - name: Verify Promotion Outputs
        run: |
          if [ "${{ steps.test-promotion.outputs.is-valid }}" != "true" ]; then
            echo "Expected is-valid to be true"
            exit 1
          fi

  test-derive-next-version:
    name: "3. CI/CD - Test derive-next-version"
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (github.event_name == 'push' || needs.find-next-version.result == 'success')
    needs: [find-next-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "actions/derive-next-version/package-lock.json"

      - name: Install dependencies
        working-directory: actions/derive-next-version
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: actions/derive-next-version
        run: npm test

      - name: Build & Bundle
        working-directory: actions/derive-next-version
        run: npm run bundle

      - name: Verify Bundle In Sync (No Drift)
        if: github.actor != 'dependabot[bot]'
        working-directory: actions/derive-next-version
        run: |
          git diff --exit-code dist/ || (echo "Error: derive-next-version dist/ is out of sync with src/. Run 'npm run bundle' locally and commit the changes." && exit 1)

      - name: Self-Test SemVer Resolution
        id: test-semver
        uses: ./actions/derive-next-version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          default-version: "0.1.0"

      - name: Verify Outputs
        run: |
          if [ -z "${{ steps.test-semver.outputs.version }}" ]; then
            echo "Expected version output to be non-empty"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "Expected env VERSION to be set"
            exit 1
          fi
