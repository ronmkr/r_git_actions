version: 2
updates:
  # Monitor npm dependencies for actions/validate-commit
  - package-ecosystem: "npm"
    directory: "/actions/validate-commit"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Monitor npm dependencies for actions/setup-branching-strategy
  - package-ecosystem: "npm"
    directory: "/actions/setup-branching-strategy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
