  # Monitor npm dependencies for actions/action-approval-gate
  - package-ecosystem: "npm"
    directory: "/actions/action-approval-gate"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Monitor GitHub Actions workflow versions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
