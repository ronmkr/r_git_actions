name: "Create Git Tag"
description: "Lightweight action to create and push a git tag (X.Y.Z) via GitHub Script."
author: "ronmkr"

branding:
  icon: "tag"
  color: "blue"

inputs:
  version:
    description: "SemVer version to tag (strictly formatted as X.Y.Z)."
    required: true

  has-bump:
    description: "Whether a version bump occurred ('true' or 'false'). Tag creation is skipped if 'false'."
    required: false
    default: "true"

  github-token:
    description: "GitHub token or PAT with contents:write permission to push the tag."
    required: false
    default: ${{ github.token }}

outputs:
  tag:
    description: "The created tag name (e.g. '1.2.3'), or empty string if skipped."
    value: ${{ steps.tag_step.outputs.tag }}

  created:
    description: "'true' if tag was created and pushed, 'false' if skipped."
    value: ${{ steps.tag_step.outputs.created }}

runs:
  using: "composite"
  steps:
    - id: tag_step
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const versionInput = "${{ inputs.version }}".trim();
          const hasBump = "${{ inputs.has-bump }}".trim().toLowerCase();

          const tagName = versionInput.replace(/^v/, '');
          if (!tagName) {
            core.setFailed("Input 'version' cannot be empty.");
            return;
          }

          if (hasBump === 'false' || hasBump === '0' || hasBump === 'no') {
            core.info(`ℹ️ Version has no bump (has-bump=${hasBump}). Skipping tag creation.`);
            core.setOutput('tag', '');
            core.setOutput('created', 'false');
            return;
          }

          const { owner, repo } = context.repo;
          const sha = context.sha;

          try {
            core.info(`🏷️ Creating tag '${tagName}' pointing to commit ${sha}...`);
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tagName}`,
              sha,
            });
            core.info(`✅ Successfully created and pushed tag '${tagName}'.`);
            core.setOutput('tag', tagName);
            core.setOutput('created', 'true');
          } catch (err) {
            if (err.status === 422) {
              core.info(`⚠️ Tag '${tagName}' already exists. Skipping creation to preserve idempotency.`);
              core.setOutput('tag', tagName);
              core.setOutput('created', 'false');
              return;
            }
            throw err;
          }
