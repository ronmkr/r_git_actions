name: 'Conventional SemVer 2.0 Action'
description: 'Derives next SemVer 2.0 tag via Conventional Commits, writes step outputs, decorates PRs, and renders visual summaries.'
author: 'SRE / Platform Engineering'

inputs:
  github-token:
    description: 'GitHub Token for authentication'
    required: false
    default: ${{ github.token }}
  create-tag:
    description: 'Whether to create and push the Git tag on GitHub'
    required: false
    default: 'true'
  post-pr-comment:
    description: 'Whether to post/update an idempotent summary comment on PRs'
    required: false
    default: 'true'
  default-version:
    description: 'Initial version if no tags exist'
    required: false
    default: 'v0.1.0'

outputs:
  previous_version:
    description: 'Last identified SemVer tag'
  version:
    description: 'Next derived SemVer 2.0 version (with prefix if previous had prefix)'
  version_clean:
    description: 'Raw SemVer 2.0 version without v prefix'
  bump_type:
    description: 'Detected bump type: major, minor, patch, or none'
  has_bump:
    description: 'Whether a version bump occurred (true/false)'

runs:
  using: 'node20'
  main: 'dist/index.js'
